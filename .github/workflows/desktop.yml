name: Desktop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:test
      - run: npm run desktop:package

      - name: Open packaged app without external Node
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.mjs

      - name: Open packaged app without external Node
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs
